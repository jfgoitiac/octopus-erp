# ═══════════════════════════════════════════════════════════════
#  OCTOPUS — Sitio institucional (octopus-sitio) — dominio raíz
#  clhma.com / www.clhma.com
#
#  No toca el server block existente de app.clhma.com (panel admin +
#  API Django) — este archivo es exclusivamente para el sitio público
#  estático servido en el dominio raíz.
#
#  Instalación (una sola vez, ver deploy/nginx/README.md):
#    sudo cp deploy/nginx/clhma.com.conf /etc/nginx/sites-available/clhma.com
#    sudo ln -s /etc/nginx/sites-available/clhma.com /etc/nginx/sites-enabled/clhma.com
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name clhma.com www.clhma.com;

    # Certbot (modo webroot) valida el dominio por acá antes de emitir el
    # certificado — dejar accesible incluso después de forzar HTTPS abajo.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://clhma.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.clhma.com;

    ssl_certificate     /etc/letsencrypt/live/clhma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clhma.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www → apex, un solo dominio canónico
    return 301 https://clhma.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clhma.com;

    ssl_certificate     /etc/letsencrypt/live/clhma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clhma.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/octopus/octopus-sitio/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Assets versionados por Vite (hash en el nombre) — cache larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA (react-router-dom v7) — cualquier ruta no encontrada cae a index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Bloquea acceso directo a archivos de config que no deberían servirse.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
