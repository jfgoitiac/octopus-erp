server {
    listen 80;
    listen [::]:80;
    server_name app.clhmacoro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.clhmacoro.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name app.clhmacoro.com;

    ssl_certificate     /etc/letsencrypt/live/clhmacoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clhmacoro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/octopus/octopus-frontend/dist;
    index index.html;

    # Assets versionados por Vite (hash en el nombre) — cache larga, inmutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # sw.js y el manifest NUNCA se cachean — si no, el navegador tarda en
    # enterarse de que hay una version nueva del Service Worker.
    location ~* ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/octopus/octopus-api/staticfiles/;
    }

    location /media/comprobantes/ {
        deny all;
    }

    location /media/ {
        alias /var/www/octopus/octopus-api/media/;
    }

    location /protected-media/ {
        internal;
        alias /var/www/octopus/octopus-api/media/;
    }
}
