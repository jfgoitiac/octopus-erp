# Snippet de referencia — NO se aplica automáticamente.
#
# Este archivo documenta el bloque que falta agregar al server block REAL de
# app.clhma.com (el nginx de la API/portal), que no vive en este repo — el
# repo solo tiene deploy/nginx/clhma.com.conf, que es el sitio institucional
# (otro dominio, no la API).
#
# Contexto: octopus-api/pagos_comunes/media_views.py::ComprobanteProtegidoView
# ya implementa el control de acceso (autenticación + autorización) para los
# comprobantes de pago (media/comprobantes/ — contienen datos bancarios y
# nombres de representantes). Esa vista, cuando settings.DEBUG=False, autoriza
# la solicitud y responde con el header X-Accel-Redirect apuntando a
# /protected-media/<path>. nginx es quien debe interceptar esa respuesta y
# servir el archivo real desde MEDIA_ROOT — pero SOLO si /protected-media/
# está declarado `internal;`, de modo que nadie pueda pedirlo directamente
# sin pasar primero por la vista de Django que verifica el permiso.
#
# Agregar esto al server block de app.clhma.com (ajustando el alias a la
# ruta real de MEDIA_ROOT en el servidor de producción):
#
#   location /protected-media/ {
#       internal;  # <- crítico: solo accesible vía X-Accel-Redirect interno,
#                  #    nunca directamente desde un request externo.
#       alias /ruta/a/MEDIA_ROOT/;
#   }
#
# IMPORTANTE — mientras este bloque no esté agregado al nginx real:
#   1. El X-Accel-Redirect emitido por ComprobanteProtegidoView NO funcionará
#      en producción (nginx no reconocerá /protected-media/ y devolverá 404).
#   2. Si además /media/comprobantes/ se sigue sirviendo público (bloque
#      `location /media/ { alias ...; }` sin autenticación, típico de un
#      despliegue Django estándar), CUALQUIERA que conozca o adivine el
#      nombre de archivo de un comprobante puede descargarlo directo, sin
#      pasar por ComprobanteProtegidoView. Eso anula por completo el control
#      de acceso agregado en el backend.
#
# Recomendación explícita: bloquear el acceso público directo a
# /media/comprobantes/ en el nginx real de app.clhma.com (ya sea con un
# `location /media/comprobantes/ { deny all; }` más específico que el
# location /media/ general, o quitando comprobantes/ del árbol servido
# públicamente) y usar ÚNICAMENTE la ruta protegida
# /media-protegido/comprobantes/<filename>/ (servida por Django, que a su vez
# delega en /protected-media/ vía X-Accel-Redirect) para acceder a estos
# archivos. El resto de /media/ (fotos de alumnos, etc.) puede seguir
# sirviéndose público si no contiene datos sensibles — evaluar caso por caso.
