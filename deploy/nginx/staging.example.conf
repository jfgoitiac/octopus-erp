# Plantilla de referencia para el subdominio de STAGING — NO se aplica
# automáticamente. Copiar a /etc/nginx/sites-available/staging.tudominio.com
# en el servidor y reemplazar los marcadores antes de habilitarla.
#
# Aislamiento respecto a deploy/nginx/app.clhmacoro.com.conf (producción):
#   - server_name propio (subdominio de staging, nunca el de producción).
#   - certificado SSL propio (certbot lo emite aparte, ver STAGING.md).
#   - root / alias apuntando SIEMPRE al checkout de staging
#     (/var/www/octopus-staging/...), nunca a /var/www/octopus/...
#   - proxy_pass a un puerto interno distinto (8001) del de producción (8000),
#     para no competir por el mismo socket ni depender de que producción
#     esté arriba.
#
# Marcadores a reemplazar:
#   STAGING_DOMAIN   -> ej. staging.clhma.com
#   STAGING_REPO     -> ej. /var/www/octopus-staging
#   STAGING_PORT     -> ej. 8001 (puerto interno del servicio Django de staging)

server {
    listen 80;
    listen [::]:80;
    server_name STAGING_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://STAGING_DOMAIN$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name STAGING_DOMAIN;

    # Certificado propio de staging (certbot --webroot -d STAGING_DOMAIN),
    # nunca reutilizar el certificado de producción.
    ssl_certificate     /etc/letsencrypt/live/STAGING_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGING_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root STAGING_REPO/octopus-frontend/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:STAGING_PORT/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:STAGING_PORT/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias STAGING_REPO/octopus-api/staticfiles/;
    }

    # Mismo bloqueo de comprobantes que producción (ver
    # deploy/nginx/app.clhmacoro.com.conf) — los comprobantes de pago de
    # staging también son datos sensibles (aunque sean de prueba), así que
    # se protegen con el mismo esquema de /media-protegido/.
    location ^~ /media/comprobantes/ {
        deny all;
    }

    location /media/ {
        alias STAGING_REPO/octopus-api/media/;
    }

    location ^~ /protected-media/ {
        internal;
        alias STAGING_REPO/octopus-api/media/;
    }
}
