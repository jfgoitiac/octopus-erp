name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octopus-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: octopus-api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Migraciones (SQLite, solo para validar que no falten)
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_SECRET_KEY: ci-only-key-no-es-secreto-real
          DJANGO_DEBUG: 'True'
        run: python manage.py test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [octopus-frontend, octopus-sitio]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # No bloqueante: hay deuda de lint preexistente (144 errores en
      # octopus-frontend, 2 en octopus-sitio) sin relación a cambios nuevos.
      # Se deja visible en el log pero no rompe el pipeline hasta que se
      # limpie esa deuda aparte — ver plan de remediación, ítem pendiente.
      - name: Lint (no bloqueante — ver nota de deuda técnica)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
